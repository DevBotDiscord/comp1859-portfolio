<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="grid.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
  <div class="content">
    <div class="grid-container">
      <div class="grid-item1"><h1>Contact</h1></div>

      <div class="grid-item2">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </div>

      <div class="grid-item3">
        <fieldset class="border border-secondary rounded p-3 w-100" style="max-width: 400px;">
          <legend class="float-none w-auto px-2 fs-6 text-secondary">Your Details:</legend>

          <!-- Name -->
          <div class="row mb-2 align-items-center">
            <label for="name" class="col-2 col-form-label col-form-label-sm">Name:</label>
            <div class="col-8">
              <input type="text" id="name" class="form-control form-control-sm">
            </div>
          </div>

          <!-- Email -->
          <div class="row mb-2 align-items-center">
            <label for="email" class="col-2 col-form-label col-form-label-sm">Email:</label>
            <div class="col-8">
              <input type="email" id="email" class="form-control form-control-sm">
            </div>
          </div>

          <!-- Password -->
          <div class="row mb-2 align-items-center">
            <label for="password" class="col-3 col-form-label col-form-label-sm">Password:</label>
            <div class="col-9">
              <input type="password" id="password" class="form-control form-control-sm">
            </div>
          </div>

          <!-- Comments -->
          <div class="mb-2">
            <label for="comments" class="col-form-label col-form-label-sm">Comments:</label>
            <textarea id="comments" class="form-control form-control-sm" rows="4"></textarea>
          </div>

          <!-- How did you hear about us? -->
          <div class="mb-2">
            <label for="source" class="col-form-label-sm">How did you hear about us?:</label>
            <select id="source" class="form-select form-select-sm w-auto">
              <option>Google</option>
              <option>Social Media</option>
              <option>Friend</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Would you visit again? -->
          <div class="mb-2">
            <label class="col-form-label col-form-label-sm d-block">Would you visit again?</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="visitAgain" id="radioYes">
                <label class="form-check-label" for="radioYes">Yes</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="visitAgain" id="radioNo">
                <label class="form-check-label" for="radioNo">No</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="visitAgain" id="radioMaybe">
                <label class="form-check-label" for="radioMaybe">Maybe</label>
              </div>
            </div>
          </div>

          <!-- Email Updates Checkbox -->
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="emailUpdates" checked>
            <label class="form-check-label" for="emailUpdates">Sign me up for email updates</label>
          </div>

          <!-- Buttons -->
          <div class="d-flex gap-2">
            <button type="reset" class="btn btn-sm btn-secondary">Reset</button>
            <button type="submit" class="btn btn-sm btn-secondary">Submit</button>
          </div>
        </fieldset>
      </div>

      <div class="grid-item4">Aside</div>
      <div class="grid-item5">Footer</div>
    </div>
  </div>
</body>
</html>
