<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Flexbox tutorial</title>
	<link rel="icon" href="matt.png"> <!-- favicon code -->
	<style type="text/css">
	body{
		margin: 0;
	}
	div{
		width: 80%;
		height: 300px;
		display: flex;
		justify-content: center;
		align-items: center;
		background-color: green;
		margin: 0 auto;
	}
	img:not(:first-child){
		display: none;
	}
		</style>
</head>
<body>
	<div>
		<img src="1.jpg" height="200px" width="200px">
		<img src="2.jpg" height="200px" width="200px">
		<img src="3.jpg" height="200px" width="200px">
		<img src="4.jpg" height="200px" width="200px">
	</div>
</body>
</html>
